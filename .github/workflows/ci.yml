name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR supersedes the old run — don't burn a runner on the stale one.
# The job only reads the repo — no releases, no comments, no packages. Naming the scope here stops
# the workflow inheriting whatever the repository default happens to be.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2

      # The MANDATORY invariant: the three version files + the newest CHANGELOG heading must agree.
      - name: Version consistency
        run: bash scripts/check-version.sh

      - name: Install (root)
        run: bun install --frozen-lockfile
      - name: Typecheck (root)
        run: bun run typecheck
      - name: Test (bridge)
        run: bun run test

      - name: Install (web)
        run: cd web && bun install --frozen-lockfile
      - name: Typecheck (web)
        run: cd web && bun run typecheck
      - name: Test (web)
        run: cd web && bun run test

  # Factory tests live under adws/, not scripts/. A Bun wrapper that shells
  # out to them (uv or python3) would put factory tests on the app suite and
  # fail on GitHub, which has no uv (#105). Separate job, python3, no uv.
  factory:
    name: factory unittests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Factory tests
        env:
          PYTHONPATH: adws
        run: |
          python -m pip install --disable-pip-version-check "pydantic>=2"
          python -m unittest adw_modules.test_out_of_scope adw_modules.test_permissions
