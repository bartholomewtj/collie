id = "herdr.collie"
name = "Collie"
version = "0.56.2"
min_herdr_version = "0.7.0"
description = "Mobile web UI to monitor and reply to your agent herd, served over Tailscale"
platforms = ["linux", "macos", "windows"]

# This plugin is a thin launcher. POSIX hosts run scripts/collie-ctl.sh. Windows Herdr cannot:
# PATH's bash.exe is the WSL stub, and Herdr rejects duplicate action ids, so one command array
# has to work on the host that actually runs the action. Lifecycle verbs therefore call
# build/collie-action-v1.exe, which launches contrib/windows/collie-ctl.ps1. Linux/macOS still
# run the same verbs via `bash scripts/collie-ctl.sh …` from a terminal; the Herdr action on
# those hosts needs the exe (or a local manifest edit back to bash). This fork's operator is
# on Windows — that is the surface the in-app banner copies.

# Build the web UI at install time. Herdr runs [[build]] steps ONLY on `herdr plugin install`
# (GitHub) — NOT on `herdr plugin link` (local dev), which instead builds lazily on first `start`.
# Two build rows are legal (herdr picks the host-matching one).
[[build]]
command = ["bash", "scripts/collie-ctl.sh", "build"]
platforms = ["linux", "macos"]

[[build]]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "contrib/windows/collie-ctl.ps1", "build"]
platforms = ["windows"]

[[actions]]
id = "start"
title = "Start web bridge"
contexts = ["workspace"]
platforms = ["windows"]
command = ["build/collie-action-v1.exe", "start"]

[[actions]]
id = "stop"
title = "Stop web bridge"
contexts = ["workspace"]
platforms = ["windows"]
command = ["build/collie-action-v1.exe", "stop"]

[[actions]]
id = "restart"
title = "Restart web bridge"
contexts = ["workspace"]
platforms = ["windows"]
command = ["build/collie-action-v1.exe", "restart"]

# Full teardown: stops + disables the service, removes the systemd --user unit, and resets
# tailscale serve. Leaves the .env and the checkout (so `start` can bring it right back). See
# scripts/collie-ctl.sh → cmd_uninstall / contrib/windows/collie-ctl.ps1 Uninstall-Collie.
[[actions]]
id = "uninstall"
title = "Uninstall web bridge (remove service)"
contexts = ["workspace"]
platforms = ["windows"]
command = ["build/collie-action-v1.exe", "uninstall"]

# Link-mode plugins ARE their on-disk git checkout (Herdr has no native `plugin update`), so this
# action pulls + rebuilds + restarts in one step. See scripts/collie-ctl.sh → cmd_update.
[[actions]]
id = "update"
title = "Update plugin"
contexts = ["workspace"]
platforms = ["windows"]
command = ["build/collie-action-v1.exe", "update"]

# The consent for a MAJOR upgrade (ADR 0025). `update` stays inside the major this install is on, so
# crossing one is a separate, deliberate invocation — and it has to be invokable from HERE, because a
# plugin action runs with no TTY and the phone banner that announces the major has no terminal at
# all. The flag IS the consent; there is no prompt behind it. See scripts/collie-ctl.sh →
# update_checkout.
[[actions]]
id = "update-major"
title = "Update across a major version"
contexts = ["workspace"]
platforms = ["windows"]
command = ["build/collie-action-v1.exe", "update", "--major"]

[[actions]]
id = "url"
title = "Show bridge URL"
contexts = ["workspace"]
platforms = ["windows"]
command = ["build/collie-action-v1.exe", "url"]

[[actions]]
id = "status"
title = "Bridge status"
contexts = ["workspace"]
platforms = ["windows"]
command = ["build/collie-action-v1.exe", "status"]

[[actions]]
id = "version"
title = "Show version"
contexts = ["workspace"]
platforms = ["windows"]
command = ["build/collie-action-v1.exe", "version"]

# POSIX twins of the lifecycle verbs. Same titles, different ids — herdr rejects duplicate action
# ids even when platforms differ (0.7.1 through 0.8.0). Linux/macOS operators still type
# `herdr plugin action invoke start --plugin herdr.collie` if they locally edit this file; the
# committed ids that match the banner (`update`, `restart`, `update-major`) are the Windows ones.
# Use the shell script on POSIX: `bash scripts/collie-ctl.sh update`.
[[actions]]
id = "start-posix"
title = "Start web bridge (POSIX)"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["bash", "scripts/collie-ctl.sh", "start"]

[[actions]]
id = "stop-posix"
title = "Stop web bridge (POSIX)"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["bash", "scripts/collie-ctl.sh", "stop"]

[[actions]]
id = "restart-posix"
title = "Restart web bridge (POSIX)"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["bash", "scripts/collie-ctl.sh", "restart"]

[[actions]]
id = "uninstall-posix"
title = "Uninstall web bridge (POSIX)"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["bash", "scripts/collie-ctl.sh", "uninstall"]

[[actions]]
id = "update-posix"
title = "Update plugin (POSIX)"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["bash", "scripts/collie-ctl.sh", "update"]

[[actions]]
id = "update-major-posix"
title = "Update across a major version (POSIX)"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["bash", "scripts/collie-ctl.sh", "update", "--major"]

[[actions]]
id = "url-posix"
title = "Show bridge URL (POSIX)"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["bash", "scripts/collie-ctl.sh", "url"]

[[actions]]
id = "status-posix"
title = "Bridge status (POSIX)"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["bash", "scripts/collie-ctl.sh", "status"]

[[actions]]
id = "version-posix"
title = "Show version (POSIX)"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["bash", "scripts/collie-ctl.sh", "version"]

# Turning push on is two steps that both used to happen OUTSIDE Herdr: generate a VAPID keypair with
# a tool you had to know about, then hand-edit a .env in a directory you had to go looking for. Both
# are actions now, because "which .env" is the part that actually goes wrong — `push-keys` writes to
# the same config dir every other verb resolves, and `push-test` proves the result without waiting
# for an agent to block. Restart between them; the keys are read at start.
#
# NOTE: on Herdr <0.8.0 a managed install invokes the action set cached at INSTALL time (ADR 0006),
# so these two appear only after the next `herdr plugin install`. The shell verbs work immediately
# either way. The Windows ctl does not yet wrap these two, so they stay POSIX.
[[actions]]
id = "push-keys"
title = "Generate push keys"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["bash", "scripts/collie-ctl.sh", "push-keys"]

[[actions]]
id = "push-test"
title = "Send a test notification"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["bash", "scripts/collie-ctl.sh", "push-test"]
