# sssf.config.yaml — the factory's agent roster. One agent, one prompt, one purpose.
#
# Mixed roster. Planner is Claude Code opus (subscription, thinking high) —
# glm-5.3 via OpenRouter hung on an idle timeout while dumping thinking.
# The other seats are the 2026-08-22 Balanced OpenRouter set via pi: builder
# gpt-5.6-luna, scout deepseek-v4-flash-0731, reviewer grok-4.6, documenter
# muse-spark-1.2-contributor. Metered cost is the four pi seats only.
#
# The key comes from pi's own models.json (`~/.pi/agent/models.json`, or
# PI_MODELS_PATH), NOT from .env — nothing in adws/ reads OPENROUTER_API_KEY.
# `deepseek/deepseek-v4-flash-0731` and `meta/muse-spark-1.2-contributor`
# are registered as custom models in that file; `pi --list-models` is the
# check if a pi seat ever fails to resolve. Planner uses the local `claude` CLI.
#
# There are no shipped cost tiers to choose from. This file IS the roster: edit
# it once, here, after install. `coding_agent:` is per-agent — `claude_code`,
# `agy`, `grok`, or `pi` for OpenRouter models (set a matching
# `openrouter/<model-id>`).
#
# In a sandbox (fleet/sbx.py), pi runs on a disposable minted key with a hard
# dollar limit (`up --budget`), not the key above.
defaults:
  coding_agent: claude_code
  model: sonnet                    # alias (opus|sonnet|haiku|fable) or an explicit claude-* id
  thinking: medium                 # maps to Claude Code --effort: low | medium | high | xhigh | max
  harness_engineering: []          # pi-only (loads .ts extensions); ignored by claude_code
  # Roster-wide allowlist, in Claude Code's tool vocabulary — case-sensitive.
  # Any agent may override with its own list. On claude_code agents this is
  # ENFORCED: unlisted tools are passed to --disallowedTools, which binds even
  # in bypassPermissions mode. On pi agents, unnamed extension tools are
  # filtered the same way. The real write boundary is `writes:` via
  # permissions.py.
  tools:
    - Read                         # read file contents
    - Bash                         # execute bash commands
    - Edit                         # find/replace edits
    - Write                        # create/overwrite files
    - Grep                         # search file contents
    - Glob                         # find files by glob pattern
  # Off-limits to every agent that does not name them in its own `writes`.
  # `tools` alone cannot protect these: Bash runs `git checkout`, and Write
  # reaches any path. An agent must not be able to edit the machinery that
  # decides whether its own work passed. Enforced in adw_modules/permissions.py.
  #
  # `writes:` per agent says what it may change IN THE REPO. It never restricts
  # the session runtime under data_dir — context_handoff/, envelopes, prompts,
  # raw output. Every agent can always write its own report; `writes: []` means
  # read-only with respect to the repo, not mute.
  protected_files:
    - adws/adw_modules/
    - adws/adw_sssf_config/
    - adws/adw_*.py
  data_dir: adws/adw_data          # runtime home: {data_dir}/sessions/{adw_id}/{agent_name}/

observability:
  db: adws/adw_data/sssf.db        # tracer writes here directly; the UI polls it
  poll_ms: 500                     # visualizer live-poll cadence

agents:
  - name: planner
    coding_agent: claude_code      # subscription CLI — not OpenRouter
    model: opus                    # judgement seat; --effort high
    thinking: high
    color: "#a78bfa"                 # optional hex — the agent's lane color in the visualizer
    purpose: Turn a request into a plan the builder can implement without asking questions.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/planner/system.md
      user: adws/adw_data/prompt_engineering/planner/user.md
    writes:                        # the plan is the only thing it may leave in the repo
      - specs/
    tools:                         # full recon + write for plan.md; no Edit — the planner never touches repo files
      - Read
      - Grep
      - Glob
      - Bash
      - Write
      - Task                       # Claude Code's built-in subagents, in place of pi's subagents.ts

  - name: builder
    coding_agent: pi               # Arena #6 · Scale Code 59.1 · Showdown SWE #1
    model: openrouter/openai/gpt-5.6-luna   # ~$0.23 a run. Left gemini-3.7-flash
    thinking: medium               # (Arena slipped to #21; luna is cheaper and stronger).
    color: "#22d3ee"
    purpose: Implement the plan exactly; report every changed file in the envelope.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/builder/system.md
      user: adws/adw_data/prompt_engineering/builder/user.md
    # No `writes` key: unrestricted, and the only agent that is. It still cannot
    # touch defaults.protected_files — the builder does not get to edit its own grader.
    # No `tools` key: inherits defaults.tools. `writes:` is the boundary that holds.

  - name: scout
    coding_agent: pi               # mechanical recon — latest DeepSeek flash, 1310K ctx
    model: openrouter/deepseek/deepseek-v4-flash-0731
    thinking: low                  # ~$0.02 a run. luna moved to builder.
    color: "#fbbf24"
    purpose: Find and report where things live; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/scout/system.md
      user: adws/adw_data/prompt_engineering/scout/user.md
    writes: []                     # read-only, and now actually read-only: its findings
                                   # go to context_handoff/, which is runtime, not the repo
    tools:                         # pi DOES honour the tools flag (agy did not), so the
      - Read                       # read-only purpose is now enforced at the tool layer
      - Grep                       # too, not just rolled back afterwards by writes: [].
      - Glob
      - Bash

  # No tester agent: running the suite is a known command, so it is a kind="code"
  # phase over adw_modules/quality.py. See SKILL.md hard rule 8.

  - name: reviewer
    coding_agent: pi               # a different model FAMILY from the builder — real
    model: openrouter/x-ai/grok-4.6   # blind-spot diversity, not just a different tier.
    thinking: high                 # Arena #9 · Showdown SWE #1 · ~$0.76 a run
    color: "#fb7185"
    purpose: Confirm that what was built is what was asked for; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/reviewer/system.md
      user: adws/adw_data/prompt_engineering/reviewer/user.md
    writes: []                     # a reviewer that cannot fix cannot quietly fix — the
                                   # claim the tool list only implied, now enforced
    tools:                         # Claude Code's vocabulary, which agent_pi translates
      - Read                       # into pi's (read/grep/find/ls/bash/write). It must NOT
      - Grep                       # stay in grok-CLI spelling: those names are lowercase,
      - Glob                       # so translate_tools passes them through untouched, pi
      - Bash                       # matches none of them and filters every tool away — the
      - Write                      # reviewer then runs with nothing to read the diff with.

  - name: documenter
    coding_agent: pi               # writing up a diff is mechanical — cheap 1M-ctx seat
    model: openrouter/meta/muse-spark-1.2-contributor
    thinking: low                  # ~$0.01 a run. Scale Code 61.5.
    color: "#e879f9"
    purpose: Write up the change that was just made, from the diff; document only.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/documenter/system.md
      user: adws/adw_data/prompt_engineering/documenter/user.md
    writes:                        # documentation only — "document only" is a rule now,
      - app_docs/                  # not a line in a prompt the model may drift from.
      - docs/                      # Markdown anywhere, because docs live next to the
      - "**/*.md"                  # code they describe as often as in a docs folder.
      - "*.md"
    tools:                         # reads the diff and the code; writes/edits documentation only
      - Read
      - Grep
      - Glob
      - Bash
      - Write
      - Edit
